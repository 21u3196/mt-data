services:
  app:
    build: .
    container_name: datavending_app
    ports:
      - "8080:80"
      - "3306:3306"
    environment:
      - DB_HOST=localhost
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=datavending
    volumes:
      - .:/var/www/localhost/htdocs
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
